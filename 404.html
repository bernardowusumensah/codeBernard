<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bernard Owusu Mensah - Portfolio</title>
  <script>
    // This script takes the current url and converts it into a redirect
    // for the index.html page with the route as a query parameter
    const pathSegmentsToKeep = 1; // Change this if deploying to a subdirectory
    
    const l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>
